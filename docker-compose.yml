# Chạy backend + Postgres giống môi trường deploy. Frontend chạy riêng: cd frontend && npm run dev
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: chememe
      POSTGRES_PASSWORD: chememe
      POSTGRES_DB: chememe
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  backend:
    build: ./backend
    env_file:
      - path: backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://chememe:chememe@db:5432/chememe
      STORAGE_BACKEND: local
      LOCAL_STORAGE_DIR: /data/storage
      PUBLIC_BASE_URL: http://localhost:8000
      ALLOWED_ORIGINS: http://localhost:3000
      PORT: "8000"
    ports: ["8000:8000"]
    volumes: [storage:/data/storage]
    depends_on: [db]

volumes:
  pgdata:
  storage:
